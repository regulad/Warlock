[workspace]
resolver = "3"
members = ["crates/awdl-core", "crates/awdl-proto", "crates/devourer-sys", "crates/warlock", "crates/warlock-api", "crates/warlock-capture", "crates/warlock-client", "crates/warlock-msi", "crates/warlock-msi-ca", "crates/warlockctl", "crates/warlock-radio", "crates/warlock-tun", "crates/warlock-usb"]

[workspace.package]
# Warlock's one version, which every crate, the API contract and the MSI
# carry: semver, with 0.y.z read as y for breaking changes (PLAN.md,
# "Versioning").
version = "0.2.1"
edition = "2024"
license = "GPL-2.0-only"
authors = ["Parker Wahle <regulad@regulad.xyz>"]

# Our own crates, which members depend on with `workspace = true`. The
# versions keep them from being wildcards (deny.toml).
[workspace.dependencies]
awdl-core = { path = "crates/awdl-core", version = "0.2.0" }
awdl-proto = { path = "crates/awdl-proto", version = "0.2.0" }
devourer-sys = { path = "crates/devourer-sys", version = "0.2.0" }
warlock-api = { path = "crates/warlock-api", version = "0.2.0" }
warlock-capture = { path = "crates/warlock-capture", version = "0.2.0" }
warlock-client = { path = "crates/warlock-client", version = "0.2.0" }
warlock-radio = { path = "crates/warlock-radio", version = "0.2.0" }
warlock-tun = { path = "crates/warlock-tun", version = "0.2.0" }
warlock-usb = { path = "crates/warlock-usb", version = "0.2.0" }

[profile.release]
debug = "line-tables-only"
