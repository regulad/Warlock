# pre-commit (https://pre-commit.com) hooks. They run on every commit once
# installed (`pre-commit install`, or globally through an init template);
# `pre-commit run --all-files` runs them on the whole tree.
#
# Needs on PATH: cargo with its fmt and clippy subcommands, and Node.js for
# the API lint.
#
# The licence text stays exactly as published.
exclude: '^LICENSE\.md$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
  # Our own C and C++: the devourer-sys shim (crates/devourer-sys/.clang-format).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: local
    hooks:
      # Formats in place (rustfmt.toml); a commit that needed it fails once,
      # with the changes left to stage.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: '\.rs$|(^|/)rustfmt\.toml$'
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$'
        pass_filenames: false
      # Dependencies: licences against PLAN.md's licence zone, RustSec
      # advisories, banned crates and sources (deny.toml). Fetches the
      # advisory database, so it needs the network.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        files: '(^|/)Cargo\.(toml|lock)$|^deny\.toml$'
        pass_filenames: false
      # The API contract against Redocly's recommended rules (redocly.yaml).
      # Through the system's npx: pre-commit's own Node environments can't
      # use an installed Node.js on Windows.
      - id: redocly-lint
        name: redocly lint api/openapi.yaml
        entry: npx --yes @redocly/cli@2.73.0 lint api/openapi.yaml
        language: system
        files: '^api/.*\.yaml$|^redocly\.yaml$'
        pass_filenames: false
