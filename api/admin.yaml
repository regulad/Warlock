openapi: 3.2.0
info:
  title: Warlock admin API
  # Warlock's version, as api/openapi.yaml's (a test keeps them equal).
  version: 0.2.6
  license:
    name: GPL-2.0-only OR AGPL-3.0-or-later
    identifier: GPL-2.0-only OR AGPL-3.0-or-later
  summary: Captures of Warlock's radio, for its administrators.
  description: |
    What Warlock's radio hears and sends, for Wireshark and `warlockctl
    capture`. The rest of Warlock's control is the API in
    `api/openapi.yaml`, whose errors and conventions this one shares.

    ## Transport

    HTTP/1.1 on the named pipe `\\.\pipe\warlock-admin`. The `Host` header
    is ignored, and the pipe rejects remote clients. Only Administrators
    and members of the `warlock-admin` group may open it: unlike
    `\\.\pipe\warlock`, not `warlock-users`.

    A capture hears every device near the radio, not only Warlock's AWDL
    peers, and with `tx` Warlock's own traffic, for every user of the PC.
    So it's a separate pipe, which Windows guards by its access list alone.

    ## Captures

    For packets, capture on the "Warlock AWDL" adapter, for instance with
    Wireshark. For frames, including those Warlock doesn't deliver, such as
    ones it can't read as AWDL, `GET /v1/capture` streams what the radio
    hears as radiotap pcapng. Like the API's events, a capture holds nothing
    and lasts as long as its connection.

    ## Errors

    Every 4xx and 5xx response carries an `Error`, as in `api/openapi.yaml`.

    ## Compatibility

    As `api/openapi.yaml`'s: the version is Warlock's, semver, with the
    middle number changing on a break before 1.0.0.
# No HTTP authentication: who may connect is decided by the pipe's access
# control list (see Transport), which OpenAPI can't express.
security: []
tags:
  - name: capture
    summary: The radio's frames
    description: 802.11 frames as the radio hears and sends them, for Wireshark.
servers:
  - url: http://warlock
    description: The named pipe `\\.\pipe\warlock-admin`; the host is ignored.
paths:
  /v1/capture:
    get:
      operationId: capture
      tags: [capture]
      summary: Capture the radio's frames
      description: |
        The 802.11 frames the radio hears from the moment of the request,
        and the ones it sends if `tx` says so, as a pcapng stream until the
        connection closes. It holds nothing: closing it changes nothing.

        The stream opens with a section header and one interface (linktype
        127, radiotap). Then each frame comes as an enhanced packet block.
        Its radiotap header has the TSF, channel and signal, and its
        `epb_flags` give the direction.

        Frames are queued for each capture. If the client reads too slowly,
        frames are dropped, never the radio held up; the next frame written
        carries the number dropped (`epb_dropcount`).

        The radio hears everything on its channel, other devices' AWDL
        frames included, so a capture can show their addresses and host
        names.
      parameters:
        - name: peer
          in: query
          description: |
            Only frames to or from these addresses (repeatable). Without it,
            every frame.
          schema:
            type: array
            items:
              type: string
              pattern: '^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$'
          style: form
          explode: true
        - name: kind
          in: query
          description: |
            `awdl`: the frames Warlock reads (AWDL action frames and
            AWDL-encapsulated data). `other`: everything else it hears.
          schema:
            type: string
            enum: [awdl, other, all]
            default: all
        - name: tx
          in: query
          description: Also Warlock's own transmissions.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The capture, as it happens.
          content:
            application/x-pcapng:
              schema:
                type: string
                contentMediaType: application/x-pcapng
        '400': { $ref: 'openapi.yaml#/components/responses/Error' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }
