# Checks every pull request, Dependabot's among them, and every push to
# master: the pre-commit hooks a commit runs (.pre-commit-config.yaml), over
# the whole tree, then the tests. Among the hooks, cargo-deny holds every
# dependency to the licence zone (deny.toml).
name: Check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Hooks and tests
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRE_COMMIT_VERSION: 4.7.0
    steps:
      # The tree is LF throughout; Windows runners would check it out CRLF.
      - name: Line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      # Cargo's downloads and the dependencies' object files (devourer's and
      # sentry-native's CMake builds among them), from master's last run
      # (Swatinem/rust-cache, pinned by its commit). Only a push to master
      # saves it: pull requests read it, and so do build.yml's jobs, which
      # never save. One key for all of them (`shared-key`); the key takes the
      # CARGO* and RUST* variables in a step's environment, so cargo-deny's
      # are its own step's, not the job's. The workspace's own crates are
      # cached too (Parker, 2026-11-22): devourer-sys's and
      # sentry-native-sys's CMake builds, in their build scripts, were most
      # of a cached run. It's read only on saving, so the jobs that only
      # read needn't say it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: warlock
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-workspace-crates: true
      - name: cargo-deny
        shell: pwsh
        env:
          # The cargo-deny the hooks use, pinned by its release archive's
          # SHA-256 (x86_64-pc-windows-msvc, as GitHub lists it for 0.20.2).
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc
        run: |
          $name = "cargo-deny-$env:CARGO_DENY_VERSION-x86_64-pc-windows-msvc"
          $archive = "$env:RUNNER_TEMP\$name.tar.gz"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/EmbarkStudios/cargo-deny/releases/download/$env:CARGO_DENY_VERSION/$name.tar.gz" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CARGO_DENY_SHA256) { "cargo-deny has SHA-256 $hash, not the pinned $env:CARGO_DENY_SHA256"; exit 1 }
          tar -xzf $archive -C $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$name" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: pre-commit
        run: python -m pip install "pre-commit==$env:PRE_COMMIT_VERSION"
      - name: Hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Tests
        run: cargo test --workspace --locked
