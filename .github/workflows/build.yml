# Builds Warlock, signs it with Azure Artifact Signing and packages it:
# Warlock-<version>-x64.msi, signed, with signed binaries inside.
#
# Building and signing are separate jobs. Only the signing jobs can reach
# the signing account (the `id-token` permission, an environment's
# secrets), and they run nothing but GitHub's and Microsoft's actions and a
# signature check. Nothing built here runs there, so no build script of any
# dependency is ever where it could mint the token and get something else
# signed.
#
# A `v*` tag signs from the `release` environment, anything else (a run
# started by hand) from `testing`, which signs with a test certificate.
# Parker's homelab configuration manages both and their secrets.
#
# A tag is also published: winget's manifests are written for the signed
# package, and a GitHub release carries the package and the manifests, with
# the annotated tag's message as its notes. Again the job that can write
# (the release) builds nothing. Once the release is published, its manifests
# are submitted to winget, as regubot, regulad's machine account.
#
# And a tag's debug files go to Sentry, so that the crashes every program
# reports name their functions, files and lines (PLAN.md, "Diagnostics"),
# from a job of its own: it alone has the Sentry token, it has no
# `id-token`, so it can't reach the signing account, and it runs nothing
# built here, only sentry-cli, pinned by its SHA-256, which reads the files.
# The release doesn't wait for it. Once the release is published, another
# such job makes it a release in Sentry, with its commits, and records its
# deploy to `production`.
#
# The jobs that compile take check.yml's cache, which only a push to master
# saves (Swatinem/rust-cache), and save nothing: a tag's run could only
# save for that tag, which no other run reads.
name: Build and sign

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo --version
      # Check's cache, as master's last run saved it (check.yml, which alone
      # saves it): Cargo's downloads, and the dependencies' object files,
      # which this release build doesn't use: they're the dev profile's, and
      # nothing builds the release profile on master, so the signed binaries
      # are built from source.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: warlock
          save-if: false
      # warlockctl's package builds warlock-extcap too; warlock-msi-ca is the
      # MSI's custom action DLL.
      - name: Build
        run: cargo build --release --locked -p warlock -p warlockctl -p warlock-msi-ca
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries
          path: |
            target/release/warlock.exe
            target/release/warlockctl.exe
            target/release/warlock-extcap.exe
            target/release/warlock_msi_ca.dll
          if-no-files-found: error
          retention-days: 1
      # Every program reports to Sentry: each with its PDB (warlock.pdb holds
      # devourer's and sentry-native's debug information too). Signing changes
      # neither's identifiers, so these match the release.
      - uses: actions/upload-artifact@v7
        with:
          name: debug-files
          path: |
            target/release/warlock.exe
            target/release/warlock.pdb
            target/release/warlockctl.exe
            target/release/warlockctl.pdb
            target/release/warlock-extcap.exe
            target/release/warlock_extcap.pdb
            target/release/warlock_msi_ca.dll
            target/release/warlock_msi_ca.pdb
          if-no-files-found: error
          retention-days: 1

  debug-files:
    name: Debug files to Sentry
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debug-files
          path: debug-files
      - name: sentry-cli
        env:
          VERSION: 3.8.2
          SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/$VERSION/sentry-cli-Linux-x86_64"
          echo "$SHA256  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentry-cli"
      # Each program's to its own project (PLAN.md, "Diagnostics").
      - name: Upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cli="$RUNNER_TEMP/sentry-cli"
          upload() {
            project=$1; shift
            for f in "$@"; do "$cli" debug-files check "debug-files/$f"; done
            "$cli" debug-files upload -o regulad -p "$project" --wait "${@/#/debug-files/}"
          }
          upload warlock warlock.exe warlock.pdb
          upload warlockctl warlockctl.exe warlockctl.pdb
          upload warlock-extcap warlock-extcap.exe warlock_extcap.pdb
          upload warlock-installer warlock_msi_ca.dll warlock_msi_ca.pdb

  sign-binaries:
    name: Sign the binaries
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'testing' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-binaries
          path: binaries
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: binaries
          files-folder-filter: exe,dll
      # `testing` signs with a test certificate, whose root Windows doesn't
      # trust: there a signature may fail on that and nothing else. A
      # release must be valid. (Tampering would show as HashMismatch.)
      - name: Check the signatures
        shell: pwsh
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $bad = 0
          $files = @(Get-ChildItem binaries -Include *.exe, *.dll -Recurse)
          if ($files.Count -lt 4) { "expected three programs and the DLL, found $($files.Count) files"; exit 1 }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            $untrustedRoot = $s.Status -eq 'UnknownError' -and $s.StatusMessage -match 'root certificate which is not trusted'
            $ok = $s.Status -eq 'Valid' -or ($env:RELEASE -ne 'true' -and $untrustedRoot)
            "$($f.Name): $($s.Status) ($($s.StatusMessage)) signer: $($s.SignerCertificate.Subject); issuer: $($s.SignerCertificate.Issuer); timestamped: $($null -ne $s.TimeStamperCertificate)"
            if (-not $ok) { $bad++ }
          }
          exit $bad
      - uses: actions/upload-artifact@v7
        with:
          name: signed-binaries
          path: |
            binaries/*.exe
            binaries/*.dll
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package
    needs: sign-binaries
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The licence texts, sentry-native's from its submodule (not
      # recursively, as in "Build"); the package builder itself is built
      # here.
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      # Check's cache (see "Build"): warlock-msi builds in the dev profile,
      # as Check's tests do, so it takes their object files.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: warlock
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          name: signed-binaries
          path: target/release
      - name: Package
        run: cargo run --locked -p warlock-msi -- --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-package
          path: target/msi/*.msi
          if-no-files-found: error
          retention-days: 1

  sign-package:
    name: Sign the package
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'testing' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-package
          path: package
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: package
          files-folder-filter: msi
      # The package, and the binaries inside it, unpacked by an
      # administrative install; judged as in "Sign the binaries".
      - name: Check the signatures
        shell: pwsh
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $msi = Get-ChildItem package -Filter *.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$env:RUNNER_TEMP\unpacked`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { "msiexec /a exit $($p.ExitCode)"; exit 1 }
          $files = @($msi) + @(Get-ChildItem "$env:RUNNER_TEMP\unpacked" -Recurse -Filter *.exe)
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            $untrustedRoot = $s.Status -eq 'UnknownError' -and $s.StatusMessage -match 'root certificate which is not trusted'
            $ok = $s.Status -eq 'Valid' -or ($env:RELEASE -ne 'true' -and $untrustedRoot)
            "$($f.Name): $($s.Status) ($($s.StatusMessage)) signer: $($s.SignerCertificate.Subject); issuer: $($s.SignerCertificate.Issuer); timestamped: $($null -ne $s.TimeStamperCertificate)"
            if (-not $ok) { $bad++ }
          }
          if ($files.Count -lt 4) { "expected the package and three binaries, found $($files.Count) files"; $bad++ }
          exit $bad
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: package/*.msi
          if-no-files-found: error

  manifests:
    name: winget manifests
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign-package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      # Check's cache, as in "Package".
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: warlock
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package
      # The tag names the version the package carries: v0.1.0 for
      # Warlock-0.1.0-x64.msi. The installer URL is where the release step
      # puts it.
      - name: Write the manifests
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          DOWNLOADS: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          $name = "Warlock-$($env:TAG.Substring(1))-x64.msi"
          if (-not (Test-Path "package/$name")) {
            "The tag $env:TAG wants package/$name, which isn't there: does Cargo.toml's version match the tag?"
            Get-ChildItem package
            exit 1
          }
          cargo run --locked -p warlock-msi -- winget "package/$name" --installer-url "$env:DOWNLOADS/$env:TAG/$name" --out manifests
      - uses: actions/upload-artifact@v7
        with:
          name: manifests
          path: manifests/*.yaml
          if-no-files-found: error

  release:
    name: Release
    needs: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh reads the notes from the tag in a clone: --notes-from-tag
      # refuses --repo. Checkout leaves the tag lightweight, pointing at
      # the commit (actions/checkout#290), so the annotated tag, message
      # and all, is fetched over it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "$TAG isn't an annotated tag: its message is the release notes (git tag -a)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: manifests
          path: assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          gh release create "$TAG" assets/*.msi assets/*.yaml \
            --title "Warlock ${TAG#v}" --notes-from-tag --verify-tag

  # The release's manifests, submitted to winget: a pull request on
  # microsoft/winget-pkgs from regubot/winget-pkgs, the fork of regubot,
  # regulad's machine account, made with Komac
  # (https://github.com/russellbanks/Komac), which commits there through
  # GitHub's API, so GitHub signs the commits. It runs once the release is
  # published, where winget's validation downloads the package, and it runs
  # nothing built here: only Komac, pinned by its SHA-256. Komac writes the
  # manifests again at its own schema version, 1.28.0, without their
  # comments.
  #
  # `komac submit` doesn't look for the version's pull request, as `komac
  # update` does, so this looks first, as `komac update` would: one whose
  # title holds the identifier and the version as words, in any state. A
  # re-run then submits nothing twice. Once it has submitted, regulad is
  # subscribed to the pull request with his own token, which holds the
  # `notifications` scope alone, so that GitHub notifies him of it; that
  # token is checked before anything is submitted.
  winget:
    name: Submit to winget
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      PACKAGE: Regulad.Warlock
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: manifests
          path: manifests
      - name: Look for the version's pull request
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(yq -r .PackageVersion "manifests/$PACKAGE.yaml")
          export VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          url=$(gh api -X GET search/issues -f q="repo:microsoft/winget-pkgs is:pr in:title $PACKAGE $VERSION" -f per_page=100 \
            --jq '.items[] | select([.title | splits("\\s+")] as $w | ($w | any(. == env.PACKAGE)) and ($w | any(. == env.VERSION))) | .html_url' |
            head -n 1)
          if [ -n "$url" ]; then echo "$PACKAGE $VERSION has its pull request already: $url"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check regulad's token
        if: steps.existing.outputs.url == ''
        env:
          GH_TOKEN: ${{ secrets.REGULAD_NOTIFICATIONS_TOKEN }}
        run: |
          login=$(gh api user --jq .login)
          if [ "$login" != regulad ]; then
            echo "REGULAD_NOTIFICATIONS_TOKEN is ${login:-nobody}'s, not regulad's"
            exit 1
          fi
      - name: Komac
        if: steps.existing.outputs.url == ''
        env:
          KOMAC_VERSION: 2.17.2
          KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/komac.tar.gz" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/komac.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac
      - name: Submit
        if: steps.existing.outputs.url == ''
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: '"$RUNNER_TEMP/komac" submit manifests --submit'
      # Among regubot's open pull requests, which GitHub lists at once, where
      # its search can take a while to index a new one.
      - name: Subscribe regulad
        if: steps.existing.outputs.url == ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          REGULAD_TOKEN: ${{ secrets.REGULAD_NOTIFICATIONS_TOKEN }}
          VERSION: ${{ steps.existing.outputs.version }}
        run: |
          pr=$(GH_TOKEN=$WINGET_TOKEN gh api graphql \
            -f query='{ viewer { pullRequests(first: 20, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}) { nodes { id url title repository { nameWithOwner } } } } }' \
            --jq '.data.viewer.pullRequests.nodes[] | select(.repository.nameWithOwner == "microsoft/winget-pkgs") | select([.title | splits("\\s+")] as $w | ($w | any(. == env.PACKAGE)) and ($w | any(. == env.VERSION))) | .id + " " + .url' |
            head -n 1)
          if [ -z "$pr" ]; then
            echo "regubot has no open pull request for $PACKAGE $VERSION"
            exit 1
          fi
          state=$(GH_TOKEN=$REGULAD_TOKEN gh api graphql \
            -f query='mutation($id: ID!) { updateSubscription(input: {subscribableId: $id, state: SUBSCRIBED}) { subscribable { viewerSubscription } } }' \
            -f id="${pr%% *}" --jq .data.updateSubscription.subscribable.viewerSubscription)
          if [ "$state" != SUBSCRIBED ]; then
            echo "Subscribing regulad to ${pr#* } failed"
            exit 1
          fi
          echo "regulad is subscribed to ${pr#* }"

  # The release in Sentry, named as every program names it
  # (`warlock@<version>`, warlock-diagnostics), in each program's project,
  # with the commits since the last one, finalized, and a deploy to
  # `production`: when it was published (PLAN.md, "Diagnostics").
  sentry-release:
    name: Release in Sentry
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      SENTRY_ORG: regulad
    steps:
      - name: sentry-cli
        env:
          VERSION: 3.8.2
          SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/$VERSION/sentry-cli-Linux-x86_64"
          echo "$SHA256  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentry-cli"
      - name: Release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          "$RUNNER_TEMP/sentry-cli" releases new "warlock@${TAG#v}" \
            -p warlock -p warlockctl -p warlock-extcap -p warlock-installer
      # Through Sentry's GitHub integration. Reports differ on whether an
      # organization token (Sentry's `org:ci` scope) may do this: if it
      # can't, the run shows the failure, and the release goes on without
      # its commits.
      - name: Commits
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: '"$RUNNER_TEMP/sentry-cli" releases set-commits "warlock@${TAG#v}" --commit "$GITHUB_REPOSITORY@$GITHUB_SHA"'
      - name: Finalize and deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          "$RUNNER_TEMP/sentry-cli" releases finalize "warlock@${TAG#v}"
          "$RUNNER_TEMP/sentry-cli" deploys new --release "warlock@${TAG#v}" -e production
