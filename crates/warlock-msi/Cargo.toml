[package]
name = "warlock-msi"
version.workspace = true
description = "Builds Warlock's MSI with Windows' own Windows Installer API and makecab, no installer toolchain"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The package's SHA-256, for winget's installer manifest.
sha2 = "0.11"
# `cargo metadata`, for the third-party notices (src/notices.rs).
serde_json = "1.0.154"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
] }
