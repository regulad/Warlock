[package]
name = "warlock-client"
version = "0.1.0"
description = "A client of Warlock's control API (api/openapi.yaml): its wire types and an HTTP client on the named pipe"
edition.workspace = true
# Like the contract it implements: GPL-2.0 Warlock and AGPL programs can both
# use it (PLAN.md, "Repos and licensing").
license = "GPL-2.0-only OR AGPL-3.0-or-later"
authors.workspace = true

[dependencies]
# HTTP (all MIT).
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = "1.12.1"
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
# Wire types (MIT OR Apache-2.0).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
