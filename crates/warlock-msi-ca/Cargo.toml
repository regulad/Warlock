[package]
name = "warlock-msi-ca"
version.workspace = true
description = "The custom actions Warlock's MSI runs from a DLL: whether the account installing is already in warlock-users, and the installer's diagnostics"
edition.workspace = true
# AGPL, unlike Warlock itself, as warlockctl is (Parker, 2026-11-21): it links
# nothing GPL-2.0-only, and Sentry's Rust SDK, which the AGPL can take
# (PLAN.md, "Repos and licensing").
license = "AGPL-3.0-only"
authors.workspace = true
publish = false

[lib]
# Loaded by Windows Installer from the package's Binary table.
crate-type = ["cdylib"]

[dependencies]
# Diagnostics (PRIVACY.md), to the `warlock-installer` project.
warlock-sentry.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Shutdown",
] }
