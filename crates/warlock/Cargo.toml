[package]
name = "warlock"
version.workspace = true
description = "Warlock: Apple Wireless Direct Link on Windows, as a service"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
awdl-core.workspace = true
awdl-proto.workspace = true
warlock-radio.workspace = true
warlock-tun.workspace = true
warlock-usb.workspace = true
warlock-api.workspace = true
# The Windows service host (MIT OR Apache-2.0).
windows-service = "=0.8.1"
# Random tags and IRKs for requests (MIT OR Apache-2.0).
getrandom = "0.4"
# SipHash-2-4, for requests' auth tags (MIT OR Apache-2.0).
siphasher = "1.0.4"
# Bluetooth LE adverts for requests, WinRT (MIT OR Apache-2.0).
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Foundation", "Foundation_Collections", "Storage_Streams"] }
# Logs (MIT).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_System_Console", "Win32_System_Diagnostics_Etw", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_NetworkManagement_NetManagement", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
warlock-capture.workspace = true
