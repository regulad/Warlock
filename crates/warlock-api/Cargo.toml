[package]
name = "warlock-api"
version = "0.1.0"
description = "Warlock's control API server (api/openapi.yaml), on a named pipe"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The wire types, shared with clients.
warlock-client.workspace = true
# The HTTP server (all MIT). Not axum: its sync_wrapper dependency is
# Apache-2.0 only (deny.toml).
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = "1.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
# Streams (MIT OR Apache-2.0).
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# JSON (MIT OR Apache-2.0).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Logs (MIT).
tracing = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Checks every response against api/openapi.yaml's schemas (MIT; YAML: MIT OR Apache-2.0).
jsonschema = { version = "0.60.2", default-features = false }
serde_norway = "0.9.42"
