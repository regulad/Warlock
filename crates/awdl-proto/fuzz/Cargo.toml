[package]
name = "awdl-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-2.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
awdl-proto = { path = ".." }

# Not part of the Warlock workspace: it needs nightly and runs under Linux
# (see README.md).
[workspace]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tlv"
path = "fuzz_targets/tlv.rs"
test = false
doc = false
bench = false
