[package]
name = "warlockctl"
version.workspace = true
description = "Warlock's control API from the command line, the way docker is a client of Docker's"
edition.workspace = true
# AGPL, unlike Warlock itself; it links only warlock-client, which is
# dual-licensed for this (PLAN.md, "Repos and licensing").
license = "AGPL-3.0-only"
authors.workspace = true

[dependencies]
warlock-client.workspace = true
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
