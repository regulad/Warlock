# cargo-deny (`cargo deny check`, run by pre-commit): what Warlock may depend
# on. The shipped binary links GPL-2.0-only devourer, so every dependency must
# be GPL-2.0-compatible (PLAN.md, "Repos and licensing").

[graph]
# Every feature, so optional dependencies are checked too.
all-features = true

[advisories]
ignore = []

[licenses]
# Apache-2.0 is left out on purpose: it isn't compatible with GPL-2.0. A
# crate offering "MIT OR Apache-2.0" is taken under MIT, and an Apache-only
# crate is rejected.
allow = [
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Our own crates. A GPL-2.0 dependency would be compatible too.
    "GPL-2.0-only",
    "GPL-2.0-or-later",
]
# AGPL only where it's ours to choose: warlockctl, which links nothing
# GPL-2.0-only. Allowed globally, an AGPL dependency could reach the
# GPL-2.0 daemon, and the two can't be combined. (warlock-client is
# "GPL-2.0-only OR AGPL-3.0-or-later", which the GPL-2.0-only allowance covers.)
exceptions = [
    { crate = "warlockctl", allow = ["AGPL-3.0-only"] },
]
confidence-threshold = 0.93
# The list is policy, not an inventory: allowed licences nothing uses yet are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our GPL-2.0-only crates may be depended on only by our GPL-2.0-only crates
# (`wrappers`): so warlockctl (AGPL-3.0-only) and warlock-client (GPL-2.0-only
# OR AGPL-3.0-or-later) can't link one, directly or through anything else,
# and stay usable under the AGPL. The licence check alone can't see this: it
# allows GPL-2.0-only across the whole workspace. A new GPL-2.0-only crate
# goes in every list, and gets an entry of its own. Every list names them
# all, so most pairs never occur: the hook runs with `-A unused-wrapper`.
deny = [
    { crate = "bincode", reason = "its 3.0 release is a tombstone; use postcard (PLAN.md)" },
    { crate = "awdl-core", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "awdl-proto", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "devourer-sys", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-api", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-capture", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-msi", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-radio", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-tun", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-usb", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
