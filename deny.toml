# cargo-deny (`cargo deny check`, run by pre-commit): what Warlock may depend
# on. The shipped binary links GPL-2.0-only devourer, so every dependency must
# be GPL-2.0-compatible (PLAN.md, "Repos and licensing").

[graph]
# Every feature, so optional dependencies are checked too.
all-features = true

[advisories]
ignore = []

[licenses]
# Apache-2.0 is left out on purpose: it isn't compatible with GPL-2.0. A
# crate offering "MIT OR Apache-2.0" is taken under MIT, and a crate offered
# under Apache-2.0 alone is rejected. That rules out Sentry's Rust SDK, whose
# `sentry-types` needs `debugid`, for the daemon: its diagnostics go through
# Sentry's native SDK instead, MIT, built from source. The AGPL programs,
# which may take Apache-2.0, use the Rust SDK (`warlock-sentry`): its
# Apache-2.0-only crates are the exceptions below, and the bans keep the SDK
# to those programs (PLAN.md, "Diagnostics").
allow = [
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Our own crates. A GPL-2.0 dependency would be compatible too.
    "GPL-2.0-only",
    "GPL-2.0-or-later",
]
# AGPL only where it's ours to choose: warlockctl, the installer's custom
# actions (warlock-msi-ca) and the Rust SDK's wrapper (warlock-sentry), which
# link nothing GPL-2.0-only. Allowed globally, an AGPL dependency could reach
# the GPL-2.0 daemon, and the two can't be combined. (warlock-client,
# warlock-diagnostics and warlock-msi-kit are "GPL-2.0-only OR
# AGPL-3.0-or-later", which the GPL-2.0-only allowance covers.)
exceptions = [
    { crate = "warlockctl", allow = ["AGPL-3.0-only"] },
    { crate = "warlock-msi-ca", allow = ["AGPL-3.0-only"] },
    { crate = "warlock-sentry", allow = ["AGPL-3.0-only"] },
    # Sentry's Rust SDK's crates offered under Apache-2.0 alone, for the AGPL
    # programs only: `sentry` itself is banned anywhere else (below).
    { crate = "debugid", allow = ["Apache-2.0"] },
    { crate = "sync_wrapper", allow = ["Apache-2.0"] },
    # native-tls's TLS off Windows; on Windows it's SChannel, and this isn't
    # built.
    { crate = "openssl", allow = ["Apache-2.0"] },
]
confidence-threshold = 0.93
# The list is policy, not an inventory: allowed licences nothing uses yet are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our GPL-2.0-only crates may be depended on only by our GPL-2.0-only crates
# (`wrappers`): so warlockctl (AGPL-3.0-only) and warlock-client (GPL-2.0-only
# OR AGPL-3.0-or-later) can't link one, directly or through anything else,
# and stay usable under the AGPL. The licence check alone can't see this: it
# allows GPL-2.0-only across the whole workspace. A new GPL-2.0-only crate
# goes in every list, and gets an entry of its own. Every list names them
# all, so most pairs never occur: the hook runs with `-A unused-wrapper`.
deny = [
    { crate = "bincode", reason = "its 3.0 release is a tombstone; use postcard (PLAN.md)" },
    # Sentry's Rust SDK only through warlock-sentry, and warlock-sentry only
    # in the AGPL programs: so its Apache-2.0-only crates never reach GPL-2.0
    # code.
    { crate = "sentry", wrappers = ["warlock-sentry"], reason = "it needs crates under Apache-2.0 alone: AGPL programs only" },
    { crate = "warlock-sentry", wrappers = ["warlockctl", "warlock-msi-ca"], reason = "AGPL-3.0-only" },
    { crate = "awdl-core", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "awdl-proto", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "devourer-sys", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "sentry-native-sys", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-api", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-capture", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-msi", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-radio", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-tun", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
    { crate = "warlock-usb", wrappers = ["awdl-core", "awdl-proto", "devourer-sys", "sentry-native-sys", "warlock", "warlock-api", "warlock-capture", "warlock-msi", "warlock-radio", "warlock-tun", "warlock-usb"], reason = "GPL-2.0-only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
